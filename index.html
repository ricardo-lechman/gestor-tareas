<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestor de Tareas, Notas y Compra</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200 p-5">

  <!-- Lista de Tareas -->
  <div class="bg-white p-4 rounded shadow mb-6">
    <h2 class="text-xl font-bold mb-2">📋 Mis Tareas</h2>
    <input id="tareaInput" class="border p-2" placeholder="Nueva tarea..." />
    <button onclick="agregar('tarea')" class="bg-blue-600 text-black px-3 py-1 rounded ml-2">Agregar</button>
    <ul id="tareaLista" class="list-disc pl-6 mt-2"></ul>
  </div>

  <!-- Lista de Notas -->
  <div class="bg-white p-4 rounded shadow mb-6">
    <h2 class="text-xl font-bold mb-2">📝 Mis Notas</h2>
    <input id="notaInput" class="border p-2" placeholder="Escribí una nota..." />
    <button onclick="agregar('nota')" class="bg-green-600 text-black px-3 py-1 rounded ml-2">Agregar</button>
    <ul id="notaLista" class="list-disc pl-6 mt-2"></ul>
  </div>

  <!-- Lista de Compras -->
  <div class="bg-white p-4 rounded shadow mb-6">
    <h2 class="text-xl font-bold mb-2">🛒 Lista de Compras</h2>
    <input id="compraInput" class="border p-2" placeholder="Producto a comprar..." />
    <button onclick="agregar('compra')" class="bg-red-600 text-black px-3 py-1 rounded ml-2">Agregar</button>
    <ul id="compraLista" class="list-disc pl-6 mt-2"></ul>
  </div>

  <script>
    // función que agrega cosas según el tipo (tarea, nota o compra)
    function agregar(tipo) {
      let input, lista;

      if (tipo === 'tarea') {
        input = document.getElementById("tareaInput");
        lista = document.getElementById("tareaLista");
      } else if (tipo === 'nota') {
        input = document.getElementById("notaInput");
        lista = document.getElementById("notaLista");
      } else if (tipo === 'compra') {
        input = document.getElementById("compraInput");
        lista = document.getElementById("compraLista");
      }

      let texto = input.value.trim();
      if (texto === "") return; // si está vacío no hago nada

      let li = document.createElement("li");
      li.textContent = texto;

      // boton para borrar
      let borrarBtn = document.createElement("button");
      borrarBtn.textContent = " x";
      borrarBtn.style.color = "red";
      borrarBtn.onclick = function() {
        lista.removeChild(li);
      };

      li.appendChild(borrarBtn);
      lista.appendChild(li);

      input.value = ""; // limpio input
    }
  </script>

</body>
</html>
